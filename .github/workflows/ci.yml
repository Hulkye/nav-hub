name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Synthetic values only; CI does not connect to a database or object store.
      DATABASE_URL: postgresql://navhub:ci-only-database-value@127.0.0.1:5432/navhub
      POSTGRES_PASSWORD: ci-only-database-value
      NUXT_PUBLIC_SITE_URL: https://navhub.example.org
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: navhub
      S3_ACCESS_KEY_ID: navhub
      S3_SECRET_ACCESS_KEY: ci-only-storage-value
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run deploy:check -- --static
